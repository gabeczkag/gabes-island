name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libx11-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/gabes-island dist/
          cp README.md LICENSE asr_vosk.py dist/
          tar -C dist -czf "gabes-island-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .
          sha256sum "gabes-island-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            > "gabes-island-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gabes-island-*-linux-x86_64.tar.gz
            gabes-island-*-linux-x86_64.tar.gz.sha256

  # The native port is a separate crate. It is an experimental preview: never
  # run on real Windows/macOS hardware, not recommended for daily use. Its
  # artifacts carry an "experimental-untested" suffix so they cannot be
  # mistaken for supported builds.
  native-windows:
    name: Windows x86_64 (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p gabes-island-native
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/gabes-island-native.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* `
            -DestinationPath "gabes-island-native-$env:GITHUB_REF_NAME-windows-x86_64-experimental-untested.zip"
          Get-FileHash "gabes-island-native-$env:GITHUB_REF_NAME-windows-x86_64-experimental-untested.zip" `
            -Algorithm SHA256 | ForEach-Object {
              "$($_.Hash.ToLower())  gabes-island-native-$env:GITHUB_REF_NAME-windows-x86_64-experimental-untested.zip"
            } | Set-Content "gabes-island-native-$env:GITHUB_REF_NAME-windows-x86_64-experimental-untested.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gabes-island-native-*-windows-x86_64-experimental-untested.zip
            gabes-island-native-*-windows-x86_64-experimental-untested.zip.sha256

  native-macos:
    name: macOS (native, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release -p gabes-island-native --target aarch64-apple-darwin
          cargo build --release -p gabes-island-native --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/gabes-island-native \
            target/x86_64-apple-darwin/release/gabes-island-native \
            -output /tmp/gabes-island-native
      - name: Package
        run: |
          mkdir -p dist
          cp /tmp/gabes-island-native dist/
          cp README.md LICENSE dist/
          tar -C dist -czf "gabes-island-native-${GITHUB_REF_NAME}-macos-universal-experimental-untested.tar.gz" .
          shasum -a 256 "gabes-island-native-${GITHUB_REF_NAME}-macos-universal-experimental-untested.tar.gz" \
            > "gabes-island-native-${GITHUB_REF_NAME}-macos-universal-experimental-untested.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gabes-island-native-*-macos-universal-experimental-untested.tar.gz
            gabes-island-native-*-macos-universal-experimental-untested.tar.gz.sha256
